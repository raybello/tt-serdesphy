<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tt-serdesphy</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #dddddd;
    --card-hover: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #30363d;
      --card-hover: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 22px; margin: 0; }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    width: 100%;
    max-width: 720px;
  }
  a.card {
    flex: 1 1 260px;
    min-width: 220px;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 20px;
    text-align: center;
    transition: background 0.15s ease;
  }
  a.card:hover { background: var(--card-hover); }
  a.card .icon { font-size: 40px; display: block; margin-bottom: 12px; }
  a.card .title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  a.card .desc { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <h1>tt-serdesphy</h1>
  <div class="cards">
    <a class="card" href="./viewer/">
      <span class="icon">&#128268;</span>
      <span class="title">3D Viewer</span>
      <span class="desc">GDS layout viewer for the latest tapeout build</span>
    </a>
    <a class="card" href="./regression/report.html">
      <span class="icon">&#129514;</span>
      <span class="title">Regression Report</span>
      <span class="desc">UVM testbench build/run results</span>
    </a>
  </div>
</body>
</html>
